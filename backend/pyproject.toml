[project]
name = "petmedia-ai"
version = "0.1.0"
description = "AI-powered social media content production backend for pet products."
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.13,<2",
    "anthropic>=2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.2.12,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "pillow>=10.3,<13",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.9",
    "pyyaml>=6,<7",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.6",
]

[tool.uv]
# The backend is an application run from this folder, not an installable library.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires a real PostgreSQL database",
    "e2e: starts real API and worker processes against PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py312"
